name = "qazaq-olymp-upload"
main = "src/index.ts"
compatibility_date = "2026-11-17"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "qazaq-olymp-files"

[vars]
FIREBASE_PROJECT_ID = "qazaq-olymp"
# Replace with the exact Cloudflare Pages domain, e.g. https://qazaq-olymp.pages.dev
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-PAGES-DOMAIN"
